<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825" role="img"><title>从即时输出，到公开 / 私有两种计算去向</title><desc>左：纯 Block AttnRes   右：相同底座 + WR-Reserve（展开一个非末层 FFN）</desc>
