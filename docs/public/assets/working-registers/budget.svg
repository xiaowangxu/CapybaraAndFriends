<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515" role="img"><title>省下公开 Down，支付下一层 Read</title><desc>FFN 矩阵参数与投影 MAC 对齐；逐元素更新、状态存储和内核效率另计。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#596965"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263a38}.title{font-size:29px;font-weight:700}.sub{font-size:17px;fill:#596965}.label{font-size:20px}.small{font-size:17px}</style>
<text x="40" y="54" class="title">省下公开 Down，支付下一层 Read</text><text x="40" y="90" class="sub">FFN 矩阵参数与投影 MAC 对齐；逐元素更新、状态存储和内核效率另计。</text>
<rect x="40" y="130" width="490" height="100" rx="10" fill="#f5f7f6" stroke="#9aaca5"/>
<text x="285.0" y="173.5" text-anchor="middle" class="label">基线：每层 3dm</text>
<text x="285.0" y="200.5" text-anchor="middle" class="label">Gate / Up  2dm  +  Down  dm</text>
<rect x="570" y="130" width="490" height="100" rx="10" fill="#e8f2ee" stroke="#267c6d"/>
<text x="815.0" y="173.5" text-anchor="middle" class="label">内部层：仍为 3dm</text>
<text x="815.0" y="200.5" text-anchor="middle" class="label">2dm  +  d(m−r)  +  dr</text>
<rect x="40" y="285" width="305" height="100" rx="10" fill="#f5f7f6" stroke="#9aaca5"/>
<text x="192.5" y="328.5" text-anchor="middle" class="label">首层：只写不读</text>
<text x="192.5" y="355.5" text-anchor="middle" class="label">相对基线 −dr</text>
<rect x="395" y="285" width="310" height="100" rx="10" fill="#e8f2ee" stroke="#267c6d"/>
<text x="550.0" y="328.5" text-anchor="middle" class="label">中间层：读旧、写新</text>
<text x="550.0" y="355.5" text-anchor="middle" class="label">相对基线 0</text>
<rect x="755" y="285" width="305" height="100" rx="10" fill="#f5f7f6" stroke="#9aaca5"/>
<text x="907.5" y="328.5" text-anchor="middle" class="label">末层：只读不写</text>
<text x="907.5" y="355.5" text-anchor="middle" class="label">相对基线 +dr</text>
<text x="550" y="448" text-anchor="middle" class="title">全网络：3Ldm  +  (L−1)r 个门偏置</text>
<text x="550" y="487" text-anchor="middle" class="small">100M 配置：L=10、d=896、m=2400、r=64 → 仅增加 576 个参数</text>
</svg>